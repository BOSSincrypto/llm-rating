name: Refresh Data

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch latest leaderboard data
        run: node scripts/refresh-data.mjs
        continue-on-error: true

      - name: Validate data
        run: npm run data:check
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/leaderboard.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/leaderboard.json
          git commit -m "chore(data): refresh leaderboard data ($DATE)"
          git push
